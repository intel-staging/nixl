name: NIXL XPU GTest

# This is a reusable workflow normally invoked by xpu-ci.yml after the
# XPU image has been built. Current CI runs on a single machine, so the
# build and test jobs share the same host Docker daemon.
#
# When invoked manually via workflow_dispatch, the image must already
# exist on that host. Either run the "NIXL XPU CI" workflow first, or
# pass an explicit image_tag input pointing at an existing local image.

on:
  workflow_call:
    inputs:
      image_tag:
        required: false
        type: string
      gtest_filter:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to test (must already exist on the runner)
        required: false
        type: string
      gtest_filter:
        description: GTest filter override (default = UCX-on-XPU subset)
        required: false
        type: string

jobs:
  xpu-gtest:
    name: Run gtest in Dockerfile.xpu container
    runs-on: xpu-nixl-test
    timeout-minutes: 180

    permissions:
      contents: read

    env:
      IMAGE_TAG: ${{ inputs.image_tag || format('nixl-xpu:sha-{0}', github.sha) }}
      CONTAINER_NAME: nixl-xpu-gtest-${{ github.run_id }}-${{ github.run_attempt }}
      BUILD_DIR: /tmp/nixl-build
      # Filter to UCX-on-XPU specific test groups. Other gtest suites
      # depend on hardware/transports not present in the XPU CI
      # environment (CUDA, EFA, etc.). Override via workflow_dispatch
      # input or by passing gtest_filter from a calling workflow.
      GTEST_FILTER: ${{ inputs.gtest_filter || 'UcxBackendParams.*:*/TestErrorHandling.*' }}

    steps:
      - name: Verify XPU image is available locally
        shell: bash
        run: docker image inspect "${IMAGE_TAG}" > /dev/null

      - name: Start XPU container
        shell: bash
        run: |
          docker run -itd \
            --name "${CONTAINER_NAME}" \
            --shm-size="32g" \
            --device=/dev/dri \
            -w /workspace/nixl \
            "${IMAGE_TAG}" \
            bash

      - name: Configure Meson build
        shell: bash
        run: |
          docker exec -e BUILD_DIR="${BUILD_DIR}" "${CONTAINER_NAME}" bash -lc '
            meson setup "${BUILD_DIR}" /workspace/nixl \
              -Dinstall_headers=true \
              -Ddisable_gds_backend=true \
              --buildtype=debug \
              -Denable_plugins=UCX \
              -Dbuild_tests=true \
              -Dbuild_examples=true
          '

      - name: Compile gtest target
        shell: bash
        run: |
          docker exec -e BUILD_DIR="${BUILD_DIR}" "${CONTAINER_NAME}" bash -lc '
            meson compile -C "${BUILD_DIR}" gtest
          '

      - name: Run gtest target
        shell: bash
        run: |
          docker exec -e BUILD_DIR="${BUILD_DIR}" -e GTEST_FILTER="${GTEST_FILTER}" "${CONTAINER_NAME}" bash -lc '
            meson test -C "${BUILD_DIR}" gtest \
              --verbose \
              --print-errorlogs \
              --timeout-multiplier 10 \
              --test-args="--gtest_filter=${GTEST_FILTER}"
          '

      - name: Remove XPU container
        if: always()
        shell: bash
        run: docker rm -f "${CONTAINER_NAME}"
